<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-page title / description / canonical / share tags are written into each page at build time
         by scripts/prerender.mjs from src/routes.js. These are the home page values. -->
    <title>RhinoScore — Operational Intelligence Platform</title>
    <meta
      name="description"
      content="The Operational Intelligence Platform. Run every site from one screen: inspections, teams, work orders, subcontractors and customer reporting together. Manage exceptions, not data. English and Spanish."
    />
    <link rel="canonical" href="https://rhinoscore.com/" />
    <meta name="theme-color" content="#06070d" />
    <meta property="og:site_name" content="RhinoScore" />
    <meta property="og:title" content="RhinoScore — Operational Intelligence Platform" />
    <meta
      property="og:description"
      content="The Operational Intelligence Platform. Run every site from one screen: inspections, teams, work orders, subcontractors and customer reporting together. Manage exceptions, not data. English and Spanish."
    />
    <meta property="og:url" content="https://rhinoscore.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://rhinoscore.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The RhinoScore owner dashboard showing today's crews, items that need attention and this week's inspection score." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/appicon.png" />
  </head>

    <script type="module" src="/src/main.jsx"></script>

</html>
